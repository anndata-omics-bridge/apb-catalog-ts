name: publish

# Publishes to npm on a version tag, with npm trusted publishing: the package's settings on npmjs.com
# name this repository and workflow, so no token secret is needed. The first version is published by
# hand, because a package must exist before it can name a trusted publisher.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apb-catalog-ts
    steps:
      - uses: actions/checkout@v7
        with:
          path: apb-catalog-ts

      # The same bundles check.yml tests against: apb-catalog's make bundle at its current main.
      - name: Check out apb-catalog
        uses: actions/checkout@v7
        with:
          repository: anndata-omics-bridge/apb-catalog
          path: apb-catalog

      - name: Check out APB2
        uses: actions/checkout@v7
        with:
          repository: anndata-omics-bridge/apb2
          path: apb2

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Build apb-catalog's bundles
        working-directory: apb-catalog
        run: |
          uv python install
          uv sync --group dev
          make bundle

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: make check

      - name: Build
        run: make build

      - name: Publish
        run: npm publish --provenance --access public
