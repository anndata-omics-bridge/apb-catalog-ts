name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apb-catalog-ts
    steps:
      - uses: actions/checkout@v7
        with:
          path: apb-catalog-ts

      # apb-catalog and apb2 at their current main, side by side as in the workspace: apb-catalog's
      # make bundle writes the bundle and the test bundle, with Python's answers, to its build/.
      - name: Check out apb-catalog
        uses: actions/checkout@v7
        with:
          repository: anndata-omics-bridge/apb-catalog
          path: apb-catalog

      - name: Check out APB2
        uses: actions/checkout@v7
        with:
          repository: anndata-omics-bridge/apb2
          path: apb2

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      # Python 3.13, as apb-catalog's own CI: the newest CPython has no h5py wheel yet.
      - name: Build apb-catalog's bundles
        working-directory: apb-catalog
        env:
          UV_PYTHON: "3.13"
        run: |
          uv python install
          uv sync --group dev
          make bundle

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apb-catalog-ts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: make check

      - name: Build
        run: make build
